# What this repository is made of, and where its parts come from. Written
# by gesir and read by it: `gesir add` builds on this, `gesir scaffold`
# lays it again, and `gesir update` brings the files it owns back to the
# catalog. Rewritten whole whenever parts are laid, so a note added here
# lasts until the next run.

[catalog]
url = "https://github.com/fconnes/gesir-catalog.git"
rev = "latest"
commit = "2f19f9d7e173cfa4cf97f8b5176ad5b0a6cd5a7c"
dir = "catalog"

[steps]
# In the order the steps were asked. Within a step, the catalog's own
# order, which is the order the parts are copied and so decides who wins
# a path two of them ship. The keys are for the reader: what resolves is
# every name below, whichever step it sits under.
project = ["homebrew-tap"]
updater = ["renovate"]
settings = ["github-standard"]
extras = ["attributes", "hooks", "style", "make"]
glue = ["make-github", "homebrew-tap-github", "make-github-renovate", "make-hooks"]

[appointments]
# The time this repository's scheduled jobs keep, in UTC: the minute, the
# hour, the weekday (0 is Sunday) and the day of the month, drawn once
# within the window the config allowed (`hours`, absent for the whole
# day). Every later run fills the files it lays from these, so edit them
# here to move the time.
minute = 14
hour = 1
weekday = 6
monthday = 19
hours = [1, 4]

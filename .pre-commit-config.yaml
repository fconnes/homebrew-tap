# Pre-commit hooks.
# Update versions with: pre-commit autoupdate
# Install with: pre-commit install
# Run on everything with: pre-commit run --all-files
#
# 4.4.0 is the release naming a local hook's language `unsupported`, the
# spelling of what `system` meant, which pre-commit is retiring; a local hook
# written that way is refused by any pre-commit older.
minimum_pre_commit_version: 4.4.0
# `pre-commit install` installs a hook for each stage named here: the commit's,
# and the push's, for a kind whose check belongs to the push (a hook naming
# `stages: [pre-push]`). A hook naming no stage runs at the commit alone, so a
# push does not run it a second time; one whose own manifest names the push as
# well (the whitespace and file checks below) runs there too, over the files
# the push carries. A clone whose hooks were installed before these lines gets
# its push hook from `pre-commit install` run again.
default_install_hook_types: [pre-commit, pre-push]
default_stages: [pre-commit]
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: detect-private-key
      - id: fix-byte-order-marker
      - id: end-of-file-fixer
        # A patch or a diff is read by a machine: its context lines hold a lone
        # space and its added lines may end in one, so rewriting either changes
        # what it applies.
        exclude: \.(patch|diff)$
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
        exclude: \.(patch|diff)$
      - id: mixed-line-ending
        args: [--fix=auto]
      - id: check-added-large-files
        args: [--maxkb=1024]
      - id: check-merge-conflict
      - id: check-symlinks
      - id: check-vcs-permalinks
      - id: check-case-conflict
      - id: check-illegal-windows-names
      - id: destroyed-symlinks
      - id: check-executables-have-shebangs
      - id: check-shebang-scripts-are-executable
      - id: check-json
        # tsconfig.json is JSONC by TypeScript's own definition, comments
        # included, and this hook reads strict JSON; inert where no such file
        # exists.
        exclude: (^|/)tsconfig\.json$
      - id: check-toml
      - id: check-xml
      - id: check-yaml
        # pnpm writes its lockfile as a stream of YAML documents, which this
        # hook reads as one file holding several and refuses; the lock is the
        # manager's own to validate. Inert where no such file exists.
        exclude: ^pnpm-lock\.yaml$
  # The acceptance criteria check, `check-acceptance`, is installed on some
  # machines and not on others. Where it is on PATH it runs from the
  # repository's root, and fails the commit where the suite and the criteria
  # disagree; a project with no criteria passes it and prints nothing. Where it
  # is not on PATH, which is every other clone and CI, the commit goes through
  # with one line saying the criteria are unchecked, never that they passed.
  # `verbose` is what shows that line on a commit that passes, pre-commit hiding
  # a passing hook's output otherwise, and it is this hook's alone: its output
  # is what tells a criterion checked from one nobody could check.
  - repo: local
    hooks:
      - id: check-acceptance
        name: check-acceptance
        entry: sh -c 'command -v check-acceptance >/dev/null 2>&1 || { printf "check-acceptance is not on PATH, so the acceptance criteria are unchecked, not passed\n"; exit 0; }; exec check-acceptance'
        language: unsupported
        pass_filenames: false
        always_run: true
        verbose: true
  # `gesir scan` refuses a commit naming what a channel protecting the repository
  # keeps out (an owner it takes from, a string it forbids), which it reads from
  # the config of the machine it runs on, so the repository never names it. It
  # runs where gesir is on PATH and has the command; anywhere else, CI among them,
  # the commit goes through with one line saying private names are unchecked,
  # never that none is there. A repository no channel scans is left alone.
  - repo: local
    hooks:
      - id: gesir-scan
        name: gesir scan
        entry: sh -c 'gesir scan --help >/dev/null 2>&1 || { printf "gesir scan is not on PATH, so private names are unchecked, not absent\n"; exit 0; }; exec gesir scan'
        language: unsupported
        pass_filenames: false
        always_run: true
  # Delegate linting to the Makefile so there is only one source of truth: this
  # hook runs exactly what `make lint` does on every commit. `make check` is the
  # gate to run before pushing; what it adds beyond lint differs per project.
  - repo: local
    hooks:
      - id: make-lint
        name: make lint
        entry: make lint
        language: unsupported
        pass_filenames: false
        always_run: true
